[mypy]
# Use Python version 3.10
python_version = 3.10

# No functions without fully typed arguments and return value
disallow_untyped_defs = True

# No function calls to untyped functions
disallow_untyped_calls = True

# Even if a function is not typed, its contents should be type-checked
check_untyped_defs = True

# No Any: types from unfollowed imports are not allowed
disallow_any_unimported = True

# No Any: expressions of type Any are not allowed
disallow_any_expr = True

# No Any: no Any in function signatures after decorators are applied
disallow_any_decorated = True

# No Any: no explicit Any in type annotations
disallow_any_explicit = True

# No Any: generic types must have type parameters (list[int] instead of list)
disallow_any_generics = True

# No Any: no subclassing of classes of type Any
disallow_subclassing_any = True

# No Any: warn when a function with a concrete return type returns Any
warn_return_any = True

# Old code: deprecated methods should not raise an error
# Old code: raising integers as an exception should be ignored (error code: misc)
disable_error_code = deprecated, misc

# Exceptions should be checked: not enforced by MyPy, because its exception
# checks fall under the disabled misc code
# (with Pylint, this can be enforced)
# Alternative for Mypy: enable misc and add "# type: ignore[misc]" to each line

# Code duplication / similarities: not supported by MyPy (handled by Pylint)

# TODOs and FIXMEs should be listed: not supported by MyPy

# Reproducible: check against the same OS platform on every machine
platform = linux

# Reproducible: always check the whole project, without command-line arguments
files = .
# Do not check the virtualenv
exclude = ^venv/

# Reproducible: warn about config sections that match no files (catches typos)
warn_unused_configs = True

# Reproducible: reports are configured here instead of on the command line
# Human-friendly report (HTML)
html_report = reports/html
# Human-friendly report (text)
txt_report = reports/txt
# Machine-friendly report (XML)
xml_report = reports/xml
# Machine-friendly report (JUnit XML, contains the actual errors)
junit_xml = reports/junit.xml


# Structured report: JSON file with typed lines per file
linecoverage_report = reports/json

# Readable report: show source code snippets and error location markers
pretty = True
# Readable report: precede each error with its context (e.g. which function)
show_error_context = True
# Readable report: show column numbers in error messages
show_column_numbers = True
# Readable report: show end line and end column of each error
show_error_end = True
# Readable report: show a documentation link for each error code
show_error_code_links = True
# Readable report: show error messages with color
color_output = True
